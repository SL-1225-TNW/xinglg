name: Verify game and save flows

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright test dependency
        run: npm install --no-save --no-package-lock playwright@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check source syntax
        run: |
          node --check game.js
          for file in tests/*.mjs; do node --check "$file"; done
      - name: Build the offline single-file game
        run: node tests/prepare-site.mjs
      - name: Verify Riverbay engineering and R3-C1/C2 recovery
        run: |
          node tests/run-r3-project.mjs
          node tests/run-r3c-prevention.mjs
          node tests/run-r3c-recovery.mjs
          node tests/run-r3-mobile.mjs
      - name: Verify character growth and independent rookie routes
        run: |
          node tests/run-r0-character-entry.mjs
          node tests/run-r1-character-growth.mjs
          node tests/run-r1-accounting.mjs
          node tests/run-r1-rookie-routes.mjs
          node tests/run-r1-mobile.mjs
          node tests/run-r2-personal.mjs
          node tests/run-r2-talents.mjs
          node tests/run-r2-mobile.mjs
          node tests/run-r2-accounting.mjs
          node tests/run-indoor-doors.mjs
      - name: Verify mill and meadow
        run: |
          node tests/run-phase-c-mill.mjs
          node tests/run-phase-c-meadow.mjs
      - name: Verify wetland, professional routes, and frontier chapter
        run: |
          node tests/run-phase-cde.mjs
          node tests/run-phase-d-review.mjs
          node tests/run-indoor-weather.mjs
          node tests/run-v7-stageE-rules.mjs
          node tests/run-v7-stageE-cloudpass.mjs
          node tests/run-v7-stageE-extras.mjs
          node tests/run-v7-stageB-soil.mjs
          node tests/run-world-map.mjs
          node tests/run-fast-travel.mjs
      - name: Verify Stage B and save regressions
        run: |
          node tests/run-v7-stageB.mjs
          node tests/run-v7-audit-regressions.mjs
      - name: Verify palace floors, doors, saves and mobile navigation
        run: |
          node tests/run-palace-layout.mjs
          node tests/run-palace-save.mjs
          node tests/run-palace-floors.mjs
          node tests/run-palace-mobile.mjs
          node tests/run-palace-wayfinding.mjs
          node tests/run-palace-east-wing.mjs
          node tests/run-palace-service.mjs
          node tests/run-palace-service.mjs --single-file
      - name: Verify university routes and research
        run: |
          node tests/run-university.mjs
          node tests/run-university.mjs --single-file
      - name: Verify south gate lodging and post routes
        run: |
          node tests/run-south-gate.mjs
          node tests/run-south-gate.mjs --single-file
      - name: Verify industrial batches and freight
        run: |
          node tests/run-industry.mjs
          node tests/run-industry.mjs --single-file
      - name: Verify clinic rooms and shared patient records
        run: |
          node tests/run-clinic-construction.mjs
          node tests/run-clinic-construction.mjs --single-file
      - name: Verify completed construction routes and records
        run: |
          node tests/run-construction-completion.mjs
          node tests/run-construction-completion.mjs --single-file
          node tests/run-construction-saves.mjs
          node tests/run-construction-saves.mjs --single-file
      - name: Verify main gameplay and responsive layout
        run: |
          node tests/run-main.mjs
          node tests/run-responsive-layout.mjs
      - name: Smoke test the single-file build
        run: node tests/run-single-file-smoke.mjs
      - name: Verify save, routes, and engineering chapter
        run: |
          node tests/run-save-invariants.mjs
          node tests/run-alt-routes.mjs
          node tests/run-engineering-career.mjs
          node tests/run-engineering-ui.mjs

      # 上传验证前已构建的站点，部署直接复用。
      - name: Upload verified site
        uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: site
          retention-days: 14
