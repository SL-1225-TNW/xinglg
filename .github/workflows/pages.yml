# 部署 GitHub Pages
#
# 门禁：不再在 push 上直接部署，而是等「Verify game and save flows」
# 全部通过后再部署，并且直接复用该次验证上传的 site 产物。
# 这样上线的就是被验证过的同一提交、同一构建结果；测试失败就不会上线。
# 手动验证请运行 Verify 工作流；正式发布仅接受 main 的 push 验证。
name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: ["Verify game and save flows"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# 部署串行执行；不让无关分支的验证事件中断正在发布的版本。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the verified commit
        id: target
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"

      - name: Checkout the verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 复用验证阶段构建好的产物，不在这里重新构建，避免两份构建不一致
      - name: Download the verified site artifact
        id: fetch
        uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: site
          run-id: ${{ steps.target.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify the artifact matches this commit
        run: |
          set -e
          test -f site/index.html
          test -f site/game.js
          test -f site/styles.css
          ls site/*单文件版*.html >/dev/null
          test "$(head -1 site/BUILD-INFO.txt)" = "commit ${{ steps.target.outputs.sha }}"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${{ steps.target.outputs.sha }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
