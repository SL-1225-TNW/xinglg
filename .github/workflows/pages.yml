# 自动开启 GitHub Pages 并部署苔芽农场
# 推送 main 后自动重新部署；也可在 Actions 页面手动点 "Run workflow"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次；用 true 让新推送取消排队中的旧部署，
# 否则一次失败会一直占着锁，后续推送全部堆在队列里永远发不出去
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # enablement: true 让这一步在仓库上自动启用 Pages，
      # 否则仓库没开过 Pages 时会直接报 "Get Pages site failed / Not Found"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate public cloud configuration
        env:
          MOSS_SUPABASE_URL: ${{ vars.MOSS_SUPABASE_URL }}
          MOSS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MOSS_SUPABASE_PUBLISHABLE_KEY }}
        run: node tests/build-cloud-config.mjs

      - name: Prepare site
        run: |
          mkdir -p site/assets site/vendor
          cp index.html styles.css game.js save-repository.js cloud-config.js cloud-auth.js account-ui.js save-coordinator.js site/
          cp vendor/supabase.js vendor/supabase-LICENSE site/vendor/
          # 顺带把单文件版也放上去，朋友可以直接在网页里下载
          cp "苔芽农场-单文件版.html" site/ 2>/dev/null || true
          # 装饰素材：百合花枝条/樱花/边框 SVG
          cp -r assets/*.svg site/assets/ 2>/dev/null || true
          cp -r assets/*.png site/assets/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
