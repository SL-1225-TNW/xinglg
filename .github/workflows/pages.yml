# 自动开启 GitHub Pages 并部署苔芽农场
# 推送 main 后自动重新部署；也可在 Actions 页面手动点 "Run workflow"。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一次，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 这一步会在仓库上启用 Pages（原本没开也能开）
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html styles.css game.js site/
          # 顺带把单文件版也放上去，朋友可以直接在网页里下载
          cp "苔芽农场-单文件版.html" site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
