<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#182d28">
<title>苔芽农场</title>
<style>
/* ============================================================
   苔芽农场 · 第二版样式
   目标：画面为主，窗口为辅，中文可读，像素风不牺牲文字清晰度
   ============================================================ */

:root{
  --grass:#7E9C5E;
  --deep:#244E3A;
  --leaf:#A1BD58;
  --path:#B9AD7D;
  --soil-dry:#99764D;
  --soil-wet:#735A42;
  --wood:#765640;
  --roof:#906255;
  --water:#79A9A0;
  --paper:#F4EED7;
  --hint:#EFD18B;

  --bg:#15241f;
  --panel:#22382f;
  --panel-2:#2c473b;
  --panel-3:#38584a;
  --line:#6d5a3c;
  --line-hi:#a4854f;
  --ink:#2b2317;
  --text:#f2ead2;
  --text-dim:#b9cdbd;
  --good:#9ed36a;
  --bad:#e08b74;
  --gold:#ffd77a;
  --focus:#ffe6a1;

  --radius:10px;
  --dock-h:96px;
  --top-h:56px;
  --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:14px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
  touch-action:manipulation;
}
/* 农场外沿：苔绿、木色与像素纹理延续游戏色板，不覆盖操作区域。 */
#frame{
  position:fixed;inset:0;pointer-events:none;z-index:40;
  border:2px solid #526b42;
  box-shadow:inset 0 0 0 1px #b9ad7d;
}
#frame > *{display:none}

button{font-family:inherit}

#app{
  min-height:100%;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(120% 80% at 50% 0%, #1e352c 0%, #14211d 70%, #101a17 100%);
}

/* ---------------- 顶部栏 ---------------- */
#topbar{
  flex:0 0 auto;
  min-height:var(--top-h);
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 14px;
  background:linear-gradient(180deg,#28443a 0%,#1d332b 100%);
  border-bottom:2px solid var(--line);
  box-shadow:0 2px 0 rgba(0,0,0,.35);
  position:relative;
  z-index:30;
}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.brand-mark{
  width:22px;height:22px;border-radius:5px;display:block;
  background:
    linear-gradient(180deg,#A1BD58 0%,#7E9C5E 60%,#244E3A 60%);
  box-shadow:inset 0 0 0 2px #244E3A;
}
.brand-text{font-size:16px;font-weight:700;color:var(--hint);letter-spacing:1px;white-space:nowrap}

.hud{
  flex:1 1 auto;
  display:flex;
  gap:6px;
  justify-content:center;
  flex-wrap:wrap;
  min-width:0;
}
.hud-cell{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:64px;padding:3px 9px;
  background:rgba(12,26,21,.55);
  border:1px solid #4a6656;border-radius:8px;
  line-height:1.25;
}
.hud-label{font-size:10px;color:var(--text-dim);letter-spacing:1px}
.hud-value{font-size:14px;font-weight:700;color:var(--paper);white-space:nowrap}
#hudCoins .hud-value{color:var(--gold)}
#hudWeather .hud-value.rain{color:#9fd0e8}
#hudEnergy .hud-value.low{
  color:#ffe1d8;background:rgba(176,63,49,.46);border-radius:4px;padding:1px 4px;
  box-shadow:0 0 0 1px rgba(255,162,139,.62);animation:energy-alert 1s steps(2,end) infinite;
}
@keyframes energy-alert{50%{background:rgba(176,63,49,.12);color:var(--bad)}}
@media (prefers-reduced-motion:reduce){#hudEnergy .hud-value.low{animation:none}}

.topbar-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.save-state{font-size:11px;color:var(--text-dim);white-space:nowrap}
.save-state.saving{color:var(--hint)}
.save-state.error{color:var(--bad)}
.icon-btn{
  width:38px;height:38px;min-width:38px;
  display:grid;place-items:center;
  background:var(--panel-2);color:var(--text);
  border:1px solid var(--line-hi);border-radius:8px;
  font-size:17px;cursor:pointer;
}
.icon-btn:hover{background:var(--panel-3)}
.icon-btn:active{transform:translateY(1px)}

/* ---------------- 舞台 ---------------- */
.farm-assist{
  flex:0 0 auto;width:min(780px,calc(100% - 24px));margin:8px auto 0;
  color:var(--paper);font-size:13px;line-height:1.5;
}
.farm-assist[hidden],.tutorial-card[hidden],.tutorial-actions button[hidden]{display:none}
.daily-tasks{padding:3px 10px;color:#c8dcb6;font-size:12px}
.tutorial-card{
  display:flex;align-items:center;gap:12px;padding:10px 12px;
  border:1px solid #968052;border-left:3px solid var(--hint);border-radius:8px;
  background:#253b30;box-shadow:0 3px 9px rgba(0,0,0,.18);
}
.tutorial-copy{flex:1;min-width:0}
.tutorial-title{font-weight:700;color:var(--hint)}
#tutorialText{margin:3px 0 0;color:#eee5cb}
.tutorial-actions{display:flex;gap:6px;flex:0 0 auto}
.tutorial-actions .btn{min-height:36px;white-space:nowrap}
@media(max-width:600px){
  .farm-assist{width:calc(100% - 16px);margin-top:4px;font-size:12px}
  .tutorial-card{flex-wrap:wrap;gap:4px;padding:6px 9px}
  .tutorial-copy{flex-basis:100%}
  .tutorial-actions{margin-left:auto}
  .tutorial-actions .btn{min-height:44px;padding:4px 10px}
  .daily-tasks{padding:2px 5px;font-size:11px}
}
/* 横屏手机：垂直空间紧张，引导卡改为贴在舞台顶部的浮层，不占布局高度，
   画布因此不再被压矮；--assist-top 由 resizeCanvas 按舞台实际位置写入。 */
@media(max-height:560px) and (orientation:landscape){
  .farm-assist{
    position:absolute;top:var(--assist-top,56px);left:50%;transform:translateX(-50%);
    width:min(560px,calc(100% - 210px));margin:0;z-index:26;pointer-events:none;font-size:11px;
  }
  .farm-assist>*{pointer-events:auto}
  .daily-tasks{
    padding:2px 8px;font-size:11px;background:rgba(26,42,34,.86);
    border:1px solid #968052;border-radius:6px;
  }
  .tutorial-card{padding:5px 9px;gap:8px}
  .tutorial-copy{flex-basis:auto}
  #tutorialText{
    margin:2px 0 0;font-size:11px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .tutorial-actions{gap:4px}
  .tutorial-actions .btn{min-height:30px;padding:2px 9px;font-size:11px}
}
#stage{
  flex:1 1 auto;
  display:flex;align-items:center;justify-content:center;
  padding:12px 12px 4px;
  min-height:0;
}
#viewport{
  position:relative;
  line-height:0;
  border:3px solid var(--line);
  border-radius:4px;
  background:#0d1512;
  box-shadow:0 0 0 2px #0b120f, 0 10px 28px rgba(0,0,0,.5);
  overflow:hidden;
  max-width:100%;
}
#world{
  display:block;
  image-rendering:pixelated;
  -webkit-optimize-contrast;
  touch-action:none;
  cursor:crosshair;
}
#world.busy{cursor:progress}

.fade{
  position:absolute;inset:0;background:#0b120f;
  opacity:0;pointer-events:none;transition:opacity .2s linear;
}
.fade.on{opacity:1}

.quest-strip{
  position:absolute;left:6px;bottom:6px;right:6px;
  display:flex;align-items:center;gap:8px;
  padding:5px 9px;
  background:rgba(16,28,23,.82);
  border:1px solid #4d6a59;border-left:3px solid var(--hint);
  border-radius:6px;
  font-size:12px;line-height:1.4;color:var(--paper);
  pointer-events:none;
  max-width:min(420px, 92%);
}
.quest-tag{
  flex:0 0 auto;font-size:10px;letter-spacing:1px;
  color:#20301f;background:var(--hint);
  padding:1px 6px;border-radius:4px;font-weight:700;
}
#questStripText{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.scene-tag{
  position:absolute;right:6px;top:6px;
  padding:2px 8px;border-radius:5px;
  background:rgba(16,28,23,.75);border:1px solid #4d6a59;
  font-size:11px;color:var(--text-dim);letter-spacing:2px;
  pointer-events:none;
}

/* ---------------- 底部：快捷栏 + 提示 ---------------- */
#dock{
  flex:0 0 auto;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px 12px 10px;
  position:relative;z-index:20;
}
.hotbar{
  display:flex;gap:5px;
  padding:5px;
  background:rgba(16,28,23,.7);
  border:2px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 3px 0 rgba(0,0,0,.4);
  max-width:100%;
  overflow-x:auto;
  scrollbar-width:thin;
}
.slot{
  position:relative;
  flex:0 0 auto;
  width:50px;height:50px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#3b5747,#2a4136);
  border:2px solid #56705f;border-radius:7px;
  cursor:pointer;padding:0;
  transition:transform .06s ease;
}
.slot:hover{background:linear-gradient(180deg,#46634f,#31503f)}
.slot canvas{image-rendering:pixelated;width:30px;height:30px;display:block}
.slot .slot-num{
  position:absolute;left:2px;top:0px;font-size:10px;font-weight:700;
  color:var(--text-dim);line-height:1;pointer-events:none;
}
.slot .slot-badge{
  position:absolute;right:2px;bottom:1px;font-size:10px;font-weight:700;
  color:var(--gold);line-height:1;pointer-events:none;text-shadow:0 1px 0 #000;
}
.slot .slot-sub{
  position:absolute;left:0;right:0;bottom:-1px;
  font-size:9px;text-align:center;color:var(--text-dim);
  line-height:1;pointer-events:none;
  transform:translateY(100%);opacity:0;transition:opacity .12s;
}
.slot.selected{
  border-color:var(--focus);
  background:linear-gradient(180deg,#5b6b3c,#3f4f2b);
  box-shadow:0 0 0 2px rgba(255,230,161,.35);
  transform:translateY(-2px);
}
.slot.locked{opacity:.4;cursor:not-allowed;filter:grayscale(1)}
.slot.empty{opacity:.55}
.slot .slot-empty-mark{font-size:9px;color:var(--text-dim);text-align:center;line-height:1.2;padding:0 2px}

.toast{
  min-height:22px;
  max-width:min(640px, 96vw);
  padding:3px 12px;
  font-size:13px;color:var(--hint);
  text-align:center;
  text-shadow:0 1px 0 rgba(0,0,0,.6);
}

/* ---------------- 触屏 ---------------- */
.touch{
  position:absolute;
  left:0;right:0;bottom:calc(var(--dock-h) + 6px);
  display:none;
  justify-content:space-between;
  align-items:flex-end;
  padding:0 10px;
  pointer-events:none;
  z-index:25;
}
.touch > *{pointer-events:auto}
.dpad{
  display:grid;
  grid-template-columns:repeat(3,46px);
  grid-template-rows:repeat(3,46px);
  gap:2px;
}
.dpad .tdir:nth-child(1){grid-area:1/2}
.dpad .tdir:nth-child(2){grid-area:2/1}
.dpad .tdir:nth-child(3){grid-area:2/3}
.dpad .tdir:nth-child(4){grid-area:3/2}
.tact{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.tbtn{
  min-width:46px;min-height:46px;
  background:rgba(40,64,54,.9);
  color:var(--text);
  border:2px solid var(--line-hi);border-radius:9px;
  font-size:12px;cursor:pointer;
  display:grid;place-items:center;
  user-select:none;-webkit-user-select:none;
}
.tbtn:active{background:var(--panel-3)}
.tact-use{width:84px;height:56px;font-size:13px}
.tact-act{width:84px;height:46px}
.tact-sm{width:84px;min-height:40px;font-size:12px;opacity:.9}

.reel{
  position:absolute;left:0;right:0;bottom:calc(var(--dock-h) + 70px);
  display:none;justify-content:center;z-index:26;pointer-events:none;
}
.reel.on{display:flex;pointer-events:auto}
.reel-btn{
  min-width:150px;min-height:64px;font-size:17px;font-weight:700;
  background:rgba(120,150,60,.92);color:#12200f;
  border:2px solid #dbe8a8;border-radius:12px;
}
.reel-btn:active{background:#b9d47a}

@media (pointer:coarse){
  .touch{display:flex}
  .icon-btn{min-width:44px;min-height:44px}
  .slot{width:52px;height:52px}
}

/* ---------------- 窗口 ---------------- */
.window-layer{
  position:fixed;inset:0;z-index:60;
  background:rgba(8,14,12,.62);
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  overflow:auto;
}
.window-layer[hidden]{display:none}
.win{
  position:relative;
  background:
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.08)),
    var(--panel);
  border:3px solid var(--line);
  border-radius:12px;
  box-shadow:0 0 0 2px #121c18, 0 18px 44px rgba(0,0,0,.6);
  width:min(720px, 100%);
  max-height:calc(100vh - 32px);
  display:flex;flex-direction:column;
  color:var(--text);
}
.win.narrow{width:min(440px,100%)}
.win.wide{width:min(880px,100%)}
.world-atlas{position:relative;width:100%;aspect-ratio:8/5;border:2px solid #897e5c;border-radius:6px;overflow:hidden;background:#d8cba2}
.world-atlas canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.atlas-place{position:absolute;transform:translate(-50%,8px);padding:4px 7px;background:#eee4c8;color:#354a37;border:1px solid #897e5c;border-radius:3px;font:inherit;font-size:12px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 0 #0003}
.atlas-place.here{background:#344f3e;color:#fff0bc;border-color:#e4c77d}
.atlas-place.planned{border-style:dashed;background:#d9d3b9;color:#5f6453}
.atlas-place.chosen,.atlas-place:focus-visible{outline:2px solid #b88c4b;outline-offset:2px}
.atlas-detail p{margin:0;line-height:1.6}
.city-plan{display:block;width:min(100%,640px);height:auto;align-self:center;border:2px solid #897e5c;image-rendering:pixelated;border-radius:4px}
#quickFood{align-self:flex-start;pointer-events:auto}
@media(max-width:520px){.atlas-place{font-size:10px;padding:3px 4px}.world-atlas{min-height:230px;aspect-ratio:auto}.atlas-place.here{max-width:94px;white-space:normal}}
.win-head{
  flex:0 0 auto;
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;
  background:linear-gradient(180deg,#3a5849,#2a4237);
  border-bottom:2px solid var(--line);
  border-radius:9px 9px 0 0;
}
.win-title{font-size:15px;font-weight:700;color:var(--hint);letter-spacing:1px;flex:1 1 auto;min-width:0}
.win-close{
  width:34px;height:34px;flex:0 0 auto;
  display:grid;place-items:center;
  background:#2a4237;color:var(--text);
  border:1px solid var(--line-hi);border-radius:7px;
  font-size:16px;cursor:pointer;
}
.win-close:hover{background:#3c5a4b}
.win-body{
  flex:1 1 auto;overflow:auto;padding:12px;
  display:flex;flex-direction:column;gap:12px;
  min-height:0;
}
.win-foot{
  flex:0 0 auto;padding:10px 12px;
  border-top:2px solid var(--line);
  display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;
  background:rgba(0,0,0,.15);
  border-radius:0 0 9px 9px;
}

/* 通用 UI 元件 */
.btn{
  min-height:36px;padding:6px 14px;
  background:linear-gradient(180deg,#3d5c4c,#2c473b);
  color:var(--text);
  border:1px solid var(--line-hi);border-radius:8px;
  font-size:13px;cursor:pointer;
}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#4a6d59,#35513f)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#7a6a34,#5d5026);border-color:var(--hint);color:#fff6d8}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#8f7c3d,#6b5c2b)}
.btn.danger{border-color:#a35f4c;background:linear-gradient(180deg,#5d3a31,#442a24)}
.btn.danger:hover:not(:disabled){background:linear-gradient(180deg,#73473b,#52322a)}
.btn.ghost{background:transparent}
.btn.sm{min-height:30px;padding:3px 10px;font-size:12px}
.btn:focus-visible,.icon-btn:focus-visible,.slot:focus-visible,.tbtn:focus-visible{
  outline:2px solid var(--focus);outline-offset:2px;
}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.spacer{flex:1 1 auto}
.muted{color:var(--text-dim);font-size:12px}
.tiny{font-size:11px}
.hr{height:1px;background:#3d5a4b;margin:2px 0}
.section-title{
  font-size:13px;color:var(--hint);letter-spacing:1px;
  display:flex;align-items:center;gap:8px;
}
.section-title::after{content:"";flex:1 1 auto;height:1px;background:#3d5a4b}
.panel-box{
  background:rgba(10,20,16,.35);
  border:1px solid #3f5c4c;border-radius:9px;padding:10px;
}
.empty-note{color:var(--text-dim);font-size:12px;padding:10px;text-align:center}

/* 物品网格 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
  gap:7px;
}
.grid.two{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.item{
  display:flex;gap:8px;align-items:flex-start;
  padding:7px 8px;
  background:linear-gradient(180deg,#2f4a3e,#263d33);
  border:1px solid #46614f;border-radius:8px;
  cursor:pointer;text-align:left;
  color:var(--text);
}
.item:hover{background:linear-gradient(180deg,#3a5a4a,#2e4a3d)}
.item.on{border-color:var(--focus);box-shadow:0 0 0 1px rgba(255,230,161,.4)}
.item.static{cursor:default}
.item.static:hover{background:linear-gradient(180deg,#2f4a3e,#263d33)}
.item-ico{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;
  background:rgba(0,0,0,.22);border-radius:6px}
.item-ico canvas{image-rendering:pixelated;width:26px;height:26px;display:block}
.item-main{flex:1 1 auto;min-width:0}
.item-name{font-size:13px;font-weight:600;display:flex;align-items:baseline;gap:6px}
.item-count{font-size:12px;color:var(--gold);font-weight:700}
.item-desc{font-size:11px;color:var(--text-dim);line-height:1.45}
.item-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}

.slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.slot-cell{
  aspect-ratio:1;display:grid;place-items:center;position:relative;
  background:rgba(0,0,0,.25);border:1px solid #3d5a4b;border-radius:6px;
}
.slot-cell.has{cursor:pointer;border-color:#5a7a66}
.slot-cell.has:hover{border-color:var(--hint)}
.slot-cell.on{border-color:var(--focus);box-shadow:0 0 0 1px rgba(255,230,161,.45)}
.slot-cell canvas{image-rendering:pixelated;width:26px;height:26px;display:block}
.slot-cell .q{
  position:absolute;right:1px;bottom:0;font-size:10px;font-weight:700;color:var(--gold);
  text-shadow:0 1px 0 #000;
}

/* 室内日历 */
.cal-big{
  text-align:center;padding:10px 0 12px;
  background:rgba(0,0,0,.22);border:1px solid #3f5c4c;border-radius:9px;
}
.cal-day{font-size:24px;font-weight:700;color:var(--hint);letter-spacing:2px}
.cal-season{font-size:12px;color:var(--text-dim);letter-spacing:4px;margin-top:2px}

/* 耕地信息浮层：显示在目标格上方，pointer-events:none 不拦截工具操作 */
.tile-tip{
  position:absolute;z-index:12;
  display:flex;flex-direction:column;gap:1px;
  padding:4px 7px;
  background:rgba(16,28,23,.92);
  border:1px solid var(--line-hi);
  border-radius:6px;
  font-size:11px;line-height:1.45;color:var(--paper);
  white-space:nowrap;pointer-events:none;
  box-shadow:0 3px 10px rgba(0,0,0,.45);
}
.tile-tip[hidden]{display:none}
.tile-tip .tt-l0{font-weight:700;color:var(--hint)}
.tile-tip .tt-l1{color:#BBD3DA}
.tile-tip.dry .tt-l1{color:#F0C88A}
.tile-tip.ripe{border-color:#9ed36a}
.tile-tip.ripe .tt-l0{color:#B6E88A}

/* 种子 / 设备类型选择（内联在快捷栏下方，不暂停游戏时间） */
.typepick{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:5px 8px;max-width:100%;
  background:rgba(16,28,23,.86);
  border:2px solid var(--line);border-radius:9px;
  box-shadow:0 3px 0 rgba(0,0,0,.4);
}
.typepick-label{font-size:11px;color:var(--hint);letter-spacing:1px;margin-right:2px}
.typepick-btn{
  min-height:30px;padding:3px 11px;
  background:#2c473b;color:var(--text);
  border:1px solid var(--line-hi);border-radius:7px;
  font-size:12px;cursor:pointer;
}
.typepick-btn:hover{background:#3c5c4b}
.typepick-btn.on{background:var(--hint);color:#2a2413;border-color:#fff0c0;font-weight:700}
.typepick-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* 对话 */
.dlg-head{display:flex;gap:10px;align-items:center}
.dlg-avatar{
  width:56px;height:56px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(180deg,#3c5a4a,#2a4237);
  border:2px solid var(--line-hi);border-radius:10px;
}
.dlg-avatar canvas{image-rendering:pixelated;width:48px;height:48px}
.dlg-name{font-size:15px;font-weight:700;color:var(--hint)}
.dlg-hearts{font-size:13px;color:#ff9aa2;letter-spacing:2px;min-height:20px}
.dlg-body{
  background:rgba(10,20,16,.4);border:1px solid #3f5c4c;border-radius:9px;
  padding:12px;font-size:14px;line-height:1.8;min-height:76px;white-space:pre-wrap;
}

/* 任务 */
.quest{border-left:3px solid var(--line-hi)}
.quest.done{border-left-color:var(--good)}
.quest.locked{opacity:.5}
.quest-name{font-size:14px;font-weight:700}
.quest-req{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.req-chip{
  font-size:12px;padding:2px 8px;border-radius:20px;
  background:rgba(0,0,0,.25);border:1px solid #47654f;
}
.req-chip.ok{color:var(--good);border-color:#4f7a3f;background:rgba(90,140,60,.15)}
.req-chip.no{color:var(--bad);border-color:#7a4a3f}

/* 商店 / 制作行 */
.shop-row{
  display:flex;gap:10px;align-items:center;
  padding:8px;background:rgba(10,20,16,.32);
  border:1px solid #3f5c4c;border-radius:9px;
}
.shop-row .item-main{flex:1 1 auto}

/* 结算 */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sum-cell{background:rgba(10,20,16,.35);border:1px solid #3f5c4c;border-radius:9px;padding:9px 11px}
.sum-k{font-size:11px;color:var(--text-dim)}
.sum-v{font-size:17px;font-weight:700;color:var(--paper)}
.sum-v.gold{color:var(--gold)}
.sum-v.good{color:var(--good)}
.sum-line{font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;gap:10px}
.sum-cell.cur{border-color:var(--gold);background:rgba(239,209,139,.10)}
.sum-block{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.sum-line .rec-k{flex:0 0 44px}
.sum-line .gold{color:var(--gold)}

/* 帮助 / 设置 */
.kbd-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.kbd-row{display:flex;gap:8px;align-items:center;font-size:12px}
kbd{
  display:inline-block;min-width:22px;text-align:center;
  padding:1px 6px;font-size:11px;font-family:ui-monospace,Consolas,monospace;
  background:#1b2f27;border:1px solid #4d6a59;border-bottom-width:2px;border-radius:5px;color:var(--paper);
}
.switch{display:flex;align-items:center;gap:10px;padding:6px 0}
.switch input{width:18px;height:18px;accent-color:#9ed36a}

textarea.save-box{
  width:100%;min-height:110px;resize:vertical;
  background:#16241f;color:var(--paper);
  border:1px solid #4d6a59;border-radius:8px;
  font-family:ui-monospace,Consolas,monospace;font-size:12px;
  padding:8px;
}

/* 钓鱼覆盖层 */
.fish-layer{
  position:absolute;inset:0;z-index:40;
  display:flex;align-items:center;justify-content:center;
  background:rgba(6,14,18,.55);
  pointer-events:none;
}
.fish-layer.on{pointer-events:auto}
.fish-card{
  background:rgba(20,38,34,.94);
  border:3px solid var(--line);
  border-radius:10px;padding:12px 14px;
  box-shadow:0 12px 30px rgba(0,0,0,.55);
  text-align:center;
}
.fish-hint{font-size:12px;color:var(--text-dim);margin-top:8px}
.fish-result{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:6px}
.fish-result canvas{image-rendering:pixelated;width:40px;height:40px}

/* 引导遮罩 */
.boot{
  position:fixed;inset:0;z-index:90;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(90% 70% at 50% 35%, #24443a 0%, #101a17 75%);
  padding:20px;
}
.boot[hidden]{display:none}
.boot-card{
  width:min(520px,100%);
  background:var(--panel);
  border:3px solid var(--line);border-radius:14px;
  padding:26px 24px;text-align:center;
  box-shadow:0 0 0 2px #0d1512, 0 20px 50px rgba(0,0,0,.6);
}
.boot-card h1{margin:0;font-size:32px;color:var(--hint);letter-spacing:4px}
.boot-sub{margin:4px 0 18px;color:var(--text-dim);letter-spacing:3px;font-size:12px}
.boot-actions{display:flex;flex-direction:column;gap:9px;align-items:stretch}
.boot-actions .btn{min-height:44px;font-size:14px}
.boot-note{margin:14px 0 0;font-size:12px;color:var(--text-dim);min-height:20px}
.boot-note.err{color:var(--bad)}
.boot-note.warn{color:var(--hint)}

/* ---------------- 响应式 ---------------- */
@media (max-width:520px){
  :root{--top-h:auto}
  #topbar{flex-wrap:wrap;gap:6px;padding:6px 8px}
  .brand-text{font-size:14px}
  .hud{order:3;width:100%;justify-content:space-between;gap:4px}
  .hud-cell{min-width:0;flex:1 1 0;padding:2px 4px}
  .hud-label{font-size:9px}
  .hud-value{font-size:12px}
  .save-state{font-size:10px}
  #stage{padding:6px 6px 2px}
  .quest-strip{font-size:11px;bottom:4px;left:4px;right:4px}
  .scene-tag{display:none}
  .window-layer{padding:8px}
  .win{max-height:calc(100vh - 16px)}
  .win-body{padding:10px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .grid.two{grid-template-columns:1fr}
  .hotbar{gap:3px;padding:4px}
  .slot{width:44px;height:44px}
  .slot canvas{width:26px;height:26px}
  .toast{font-size:12px;min-height:20px}
  .kbd-list{grid-template-columns:1fr}
}
@media (max-height:560px) and (orientation:landscape){
  /* 横屏：把顶栏与快捷栏浮在画面上，换取更大的可视范围 */
  #app{position:relative;height:100vh;overflow:hidden}
  #stage{padding:2px;height:100vh}
  #topbar{
    position:absolute;left:0;right:0;top:0;z-index:30;
    min-height:0;padding:3px 8px;
    background:linear-gradient(180deg,rgba(24,44,36,.92),rgba(24,44,36,.55));
    border-bottom:1px solid var(--line);
  }
  .hud-label{display:none}
  .hud-cell{padding:1px 6px;min-width:52px}
  .hud-value{font-size:12px}
  .quest-strip{display:none}
  #dock{
    position:absolute;left:0;right:0;bottom:0;z-index:28;
    flex-direction:row;align-items:center;justify-content:space-between;
    padding:4px 10px 6px;gap:8px;pointer-events:none;
    background:linear-gradient(0deg,rgba(16,28,23,.85),rgba(16,28,23,0));
  }
  #dock > *{pointer-events:auto}
  .hotbar{padding:3px;gap:3px}
  .slot{width:40px;height:40px}
  .slot canvas{width:24px;height:24px}
  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;min-height:18px}
  .typepick{position:absolute;left:50%;transform:translateX(-50%);bottom:56px}
  .touch{bottom:52px}
  .reel{bottom:calc(46% - 40px)}
}

@media (min-width:1700px){
  /* 大屏上画布会放到 4~6 倍，引导条只加宽不加大字号：
     加字号会撑高卡片、反而把画布压小，所以这里只放宽宽度让排版不显得局促。 */
  .farm-assist{width:min(1120px,calc(100% - 40px))}
}

/* 大屏沉浸式（html.immersive 由 resizeCanvas 统一开关，横屏设备）：
   顶栏、引导条、快捷栏全部浮在画面上，画布几乎占满屏幕。
   代价是快捷栏会压住画面底部约 100px，这是大屏满屏的取舍。 */
html.immersive #app{height:100vh;overflow:hidden}
html.immersive #stage{
  height:100vh;
  padding:calc(var(--assist-top,60px) + 8px) 8px 0;
  align-items:flex-start;justify-content:center;
}
html.immersive #topbar{
  position:absolute;left:0;right:0;top:0;z-index:30;
  background:linear-gradient(180deg,rgba(24,44,36,.94),rgba(24,44,36,.62));
}
html.immersive #dock{
  position:absolute;left:0;right:0;bottom:0;z-index:28;pointer-events:none;
  background:linear-gradient(0deg,rgba(16,28,23,.88),rgba(16,28,23,0));
}
html.immersive #dock>*{pointer-events:auto}
html.immersive .farm-assist{
  position:absolute;top:var(--assist-top,60px);left:50%;transform:translateX(-50%);
  width:min(1120px,calc(100% - 40px));margin:0;z-index:26;pointer-events:none;
}
html.immersive .farm-assist>*{pointer-events:auto}
/* 快捷栏浮起来后，委托摘要改挂在画面左上角，避免被快捷栏压住 */
html.immersive .quest-strip{top:0;bottom:auto;left:0}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* 自适应舞台：装饰只占细边，画面使用剩余的全部空间。 */
html,body{overflow:hidden}
#app{
  position:relative;height:100vh;height:100dvh;min-height:0;
  padding:env(safe-area-inset-top) env(safe-area-inset-right)
    env(safe-area-inset-bottom) env(safe-area-inset-left);
  background-color:#244e3a;
  background-image:
    repeating-linear-gradient(0deg,transparent 0 15px,rgba(161,189,88,.06) 15px 16px),
    repeating-linear-gradient(90deg,transparent 0 15px,rgba(161,189,88,.06) 15px 16px),
    radial-gradient(ellipse at 50% 40%,#567349 0%,#304f3a 65%,#22382f 100%);
}
#stage{padding:4px;overflow:hidden}
#viewport{
  flex-shrink:0;border:2px solid #765640;border-radius:3px;
  box-shadow:0 0 0 1px #b9ad7d,0 2px 8px #15241f80;
}
#topbar{padding:4px 10px;min-height:48px;background:linear-gradient(#2c473bf2,#22382fe6)}
#dock{padding:4px 6px;gap:2px}
.toast:empty{display:none}
.farm-assist{margin-top:2px;margin-bottom:2px}

html.immersive #stage{
  height:auto;flex:1;padding:4px;align-items:center;
}
html.immersive #topbar{
  top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);
}
html.immersive #dock{
  bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);
}
html.immersive .farm-assist{width:min(760px,calc(100% - 24px));margin:0}
html.immersive .quest-strip{top:auto;bottom:80px;left:6px}
.touch{
  left:env(safe-area-inset-left);right:env(safe-area-inset-right);
  bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 8px);
}
.tact{display:grid;grid-template-columns:repeat(3,44px);gap:4px}
.tact-use,.tact-act{grid-column:span 3;width:140px;min-height:44px;height:44px}
.tact-sm{width:44px;min-height:44px;font-size:11px}
.tbtn{background:#22382fc9;border-color:#a4854fbf}

@media(max-width:600px){
  #topbar{gap:4px;padding:3px 6px;min-height:44px}
  .brand-text{font-size:13px}
  .brand-mark{width:18px;height:18px}
  .save-state{display:none}
  .hud{gap:2px}
  .hud-cell{padding:2px;min-width:0}
  .hud-label{display:none}
  .hud-value{font-size:11px}
  .farm-assist{width:calc(100% - 12px)}
  .daily-tasks{font-size:10px}
  #stage{padding:3px}
  .hotbar{gap:2px;padding:3px;width:100%;justify-content:center;overflow-x:auto}
  .slot{width:clamp(28px,9.4vw,44px);height:44px;flex-shrink:0}
  .slot canvas{width:24px;height:24px}
  .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
  .touch{padding:0 8px}
  .quest-strip{bottom:166px;max-width:calc(100% - 12px);font-size:10px}
}
@media(max-height:560px) and (orientation:landscape){
  html.immersive #topbar{min-height:36px;padding:2px 8px;flex-wrap:nowrap}
  .brand-text{font-size:12px}
  .hud{order:initial;width:auto;flex-wrap:nowrap}
  .hud-value{font-size:11px}
  .hud-cell{min-width:0;padding:2px 4px}
  .icon-btn{min-height:36px;height:36px}
  html.immersive #dock{justify-content:center;padding:3px 6px}
  .hotbar{width:auto;max-width:calc(100% - 16px)}
  .slot{width:36px;height:36px}
  .farm-assist{max-width:calc(100% - 300px)}
  .tutorial-card{flex-wrap:wrap;padding:3px 6px}
  .tutorial-actions{margin-left:auto}
  .daily-tasks{display:none}
  .touch{bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 4px)}
}

@media (pointer:coarse) and (min-width:601px) and (min-height:561px){
  .quest-strip{bottom:174px}
}

/* 开始界面的设备选择，以及安卓横屏提示。 */
.device-picker[hidden],.boot-actions[hidden],.boot-note[hidden]{display:none}
.device-picker h2{margin:4px 0;color:var(--hint)}
.device-picker p{font-size:12px;color:var(--text-dim)}
.device-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.device-options .btn{min-height:76px;padding:8px 4px;font-size:16px}
.device-options span{display:block;font-size:10px;margin-top:5px}
.device-options [aria-pressed="true"]{border-color:var(--focus);background:#3f4f2b}
.boot{overflow-y:auto}
.boot-card{max-height:100%;overflow-y:auto}
html[data-device="phone"] .touch,html[data-device="tablet"] .touch{display:flex}
html[data-device="computer"] .touch{display:none}
html[data-device="phone"] .tbtn{min-width:44px;min-height:44px}
html[data-device="tablet"] .dpad{grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px)}
html[data-device="tablet"] .tact{grid-template-columns:repeat(3,52px)}
html[data-device="tablet"] .tact-use,html[data-device="tablet"] .tact-act{width:164px;height:52px}
html[data-device="tablet"] .tact-sm{width:52px;height:48px}
@media(max-height:560px) and (orientation:landscape){
  .boot{padding:8px}
  .boot-card{padding:12px 18px}
  .boot-card h1{font-size:24px}
  .boot-sub{margin:2px 0 8px}
  .boot-actions{gap:5px}
  .boot-note{margin-top:7px}
  html[data-device="tablet"] .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
  html[data-device="tablet"] .tact{grid-template-columns:repeat(3,44px)}
  html[data-device="tablet"] .tact-use,html[data-device="tablet"] .tact-act{width:140px;height:44px}
  html[data-device="tablet"] .tact-sm{width:44px;height:44px}
}

/* 横屏窗口高度不足时地图随窗口滚动，禁止 flex 把地图压成细条。 */
.world-atlas{flex:0 0 auto}

/* 手机/平板始终以横向游戏坐标运行，不依赖操作系统自动旋转。 */
#app{width:var(--play-w,100vw);height:var(--play-h,100dvh)}
html.immersive #app{height:var(--play-h,100dvh)}
html.rotated-play #app{
  position:fixed;top:0;left:100vw;min-height:0;
  transform:rotate(90deg);transform-origin:0 0;
  padding:env(safe-area-inset-right) env(safe-area-inset-bottom)
    env(safe-area-inset-left) env(safe-area-inset-top);
}
html.rotated-play #topbar{top:env(safe-area-inset-right);left:env(safe-area-inset-top);right:env(safe-area-inset-bottom)}
html.rotated-play #dock{bottom:env(safe-area-inset-left);left:env(safe-area-inset-top);right:env(safe-area-inset-bottom)}
html.rotated-play .touch{
  left:env(safe-area-inset-top);right:env(safe-area-inset-bottom);
  bottom:calc(var(--dock-h) + env(safe-area-inset-left) + 6px);
}
html.rotated-play .win{max-height:calc(var(--play-h) - 16px)}
html.rotated-play .win-body{padding:10px}
html.rotated-play #topbar{flex-wrap:nowrap}
html.rotated-play .hud{order:initial;width:auto;flex-wrap:nowrap}
html.rotated-play .hud-cell{min-width:0;flex:1 1 auto}
html.rotated-play .hotbar{width:auto;max-width:calc(100% - 16px)}
html.rotated-play .scene-tag{display:block}
html.rotated-play .quest-strip{bottom:80px}
html.compact-play #topbar{min-height:36px;padding:2px 8px;gap:6px}
html.compact-play .hud-label{display:none}
html.compact-play .hud-value{font-size:11px}
html.compact-play .hud-cell{padding:2px 4px}
html.compact-play .brand-text{font-size:12px}
html.compact-play .icon-btn{min-height:36px;height:36px}
html.compact-play #dock{flex-direction:row;justify-content:center;padding:3px 6px}
html.compact-play .hotbar{padding:3px;gap:3px}
html.compact-play .slot{width:36px;height:36px}
html.compact-play .slot canvas{width:24px;height:24px}
html.compact-play .farm-assist{width:min(560px,calc(100% - 300px));max-width:calc(100% - 300px)}
html.compact-play .tutorial-card{flex-wrap:wrap;padding:3px 6px;gap:4px}
html.compact-play .tutorial-copy{flex-basis:auto}
html.compact-play #tutorialText{font-size:11px;line-height:1.35}
html.compact-play .tutorial-actions .btn{min-height:30px;padding:2px 9px;font-size:11px}
html.compact-play .daily-tasks,html.compact-play .quest-strip{display:none}
html.compact-play .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;min-height:18px}
html.compact-play .boot{padding:8px}
html.compact-play .boot-card{padding:12px 18px}
html.compact-play .boot-card h1{font-size:24px}
html.compact-play .boot-sub{margin:2px 0 8px}
html.compact-play .boot-actions{gap:5px}
html.compact-play .boot-note{margin-top:7px}
html.compact-play .reel{bottom:calc(46% - 40px)}
html.compact-play[data-device="tablet"] .dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
html.compact-play[data-device="tablet"] .tact{grid-template-columns:repeat(3,44px)}
html.compact-play[data-device="tablet"] .tact-use,html.compact-play[data-device="tablet"] .tact-act{width:140px;height:44px}
html.compact-play[data-device="tablet"] .tact-sm{width:44px;height:44px}

/* --- 森林书 / 旅行日志：借鉴纸张、批注、图鉴与分岔选择的视觉语言 --- */
.forest-journal{
  display:grid;grid-template-columns:minmax(210px,32%) minmax(0,1fr);
  min-height:560px;overflow:hidden;border:2px solid #8b6b48;border-radius:10px;
  color:#4c3b2b;background:#d9c28e;
  box-shadow:inset 0 0 0 2px rgba(255,245,209,.45),0 12px 24px rgba(31,20,9,.26);
}
.forest-journal-cover{
  position:relative;padding:20px 18px 18px;
  background:
    radial-gradient(circle at 72% 18%,rgba(255,242,183,.35),transparent 26%),
    repeating-linear-gradient(0deg,rgba(99,68,38,.06) 0 1px,transparent 1px 5px),
    #c9a96c;
  border-right:3px solid #89683f;box-shadow:inset -8px 0 rgba(79,52,29,.09);
}
.forest-journal-cover:after{content:'';position:absolute;top:12px;bottom:12px;right:7px;width:2px;background:rgba(74,47,27,.25);box-shadow:3px 0 rgba(255,239,187,.35)}
.forest-journal-kicker,.forest-journal-page-head{font-size:10px;letter-spacing:1.4px;color:#78603d;font-weight:700}
.forest-journal-emblem{width:54px;height:54px;margin:18px auto 12px;display:grid;place-items:center;border:1px solid #8c633a;border-radius:50%;font-size:28px;color:#806039;transform:rotate(-8deg);background:rgba(255,239,181,.2)}
.forest-journal-title{text-align:center;font:700 32px Georgia,'Times New Roman',serif;letter-spacing:6px;color:#3d2b1c;text-shadow:1px 1px rgba(255,241,193,.48)}
.forest-journal-subtitle{text-align:center;color:#705437;letter-spacing:3px;font-size:12px;margin-top:4px}
.forest-journal-quote{font:italic 12px Georgia,'Times New Roman',serif;line-height:1.7;color:#735737;margin:22px 8px 18px}
.forest-journal-meta{display:flex;flex-direction:column;gap:4px;padding:9px 0;border-top:1px solid rgba(88,57,29,.35);border-bottom:1px solid rgba(88,57,29,.35);color:#624a31;font-size:11px}
.forest-journal-meta strong{font-size:14px;color:#3f3024}
.forest-journal-nav{display:flex;flex-direction:column;gap:5px;margin-top:20px}
.forest-journal-nav .btn{width:100%;text-align:left;justify-content:flex-start}
.journal-nav-btn,.journal-nav-on{min-height:31px;padding:5px 8px;border-radius:3px;border:0;border-left:3px solid transparent;background:transparent;color:#604a31}
.journal-nav-btn:hover{background:rgba(255,238,185,.34);color:#35271d}
.journal-nav-on{background:rgba(255,239,186,.63);border-left-color:#7c4d2b;color:#38291d;font-weight:700}
.forest-journal-foot{position:absolute;left:18px;bottom:15px;font:700 9px Georgia,serif;letter-spacing:1px;color:#815a3c;opacity:.72;transform:rotate(-5deg)}
.forest-journal-page{
  min-width:0;overflow:auto;padding:19px 22px 22px;
  background:
    radial-gradient(circle at 14% 14%,rgba(120,87,42,.08) 0 1px,transparent 2px),
    radial-gradient(circle at 82% 76%,rgba(120,87,42,.07) 0 1px,transparent 2px),
    repeating-linear-gradient(0deg,rgba(118,87,50,.055) 0 1px,transparent 1px 26px),
    #f4e7c3;
  box-shadow:inset 8px 0 rgba(255,249,216,.25);
}
.forest-journal-page h2{margin:8px 0 10px;font:700 25px Georgia,'Times New Roman',serif;color:#423225}
.forest-journal-page h3{margin:8px 0 5px;font:700 19px Georgia,'Times New Roman',serif;color:#493426}
.forest-journal-page p{line-height:1.7}
.journal-lead{color:#6e5840;font-size:13px;max-width:58em}
.journal-stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:15px 0}
.journal-stat{padding:10px;background:rgba(255,248,218,.55);border:1px solid rgba(126,89,48,.3);border-radius:3px}
.journal-stat span{display:block;font-size:11px;color:#7a6345}.journal-stat strong{display:block;margin-top:4px;font:700 16px Georgia,serif;color:#4c3825}
.journal-section-label{margin-top:20px;border-bottom:1px solid rgba(117,82,44,.35);padding-bottom:6px;font-size:11px;letter-spacing:1.2px;color:#816547;font-weight:700}
.journal-hand{font:italic 15px Georgia,'Times New Roman',serif;color:#614a34}
.journal-callout{display:flex;flex-direction:column;gap:4px;margin-top:18px;padding:11px 13px;border-left:4px solid #8e6841;background:rgba(203,178,122,.2);color:#654c31}
.journal-callout strong{font:700 14px Georgia,serif}
.journal-discovery,.journal-person{display:flex;gap:11px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid rgba(117,82,44,.25)}
.journal-discovery-mark,.journal-person-avatar{flex:0 0 36px;width:36px;height:36px;display:grid;place-items:center;border:1px solid #a27b4c;border-radius:50%;color:#79552f;background:rgba(255,240,190,.5);font-size:18px}
.journal-discovery strong,.journal-person strong{font:700 16px Georgia,serif;color:#493426}.journal-discovery p,.journal-person p{margin:3px 0 0;color:#705a40;font-size:12px}
.journal-discovery.locked{opacity:.52;filter:grayscale(.3)}
.journal-choice-card{margin-top:13px;padding:15px;background:rgba(255,247,213,.66);border:1px solid #a27b4c;border-radius:4px;box-shadow:2px 3px 0 rgba(100,64,30,.1)}
.journal-choice-card.locked{opacity:.6}
.journal-choice-kicker{font-size:10px;letter-spacing:1.2px;color:#856846;font-weight:700}
.journal-choice-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.journal-choice-btn{min-height:38px!important;background:linear-gradient(180deg,#f8eac2,#ddc693)!important;border:1px solid #9d7648!important;color:#5b432b!important}
.journal-choice-result{margin-top:12px;padding:8px 10px;border-left:3px solid #788d58;background:rgba(119,147,77,.12);color:#53663a;font-size:12px}
@media (max-width:620px){
  .forest-journal{grid-template-columns:1fr;min-height:0}
  .forest-journal-cover{padding:14px;border-right:0;border-bottom:3px solid #89683f}
  .forest-journal-cover:after{display:none}
  .forest-journal-emblem{margin:8px auto}.forest-journal-title{font-size:27px}
  .forest-journal-quote{display:none}
  .forest-journal-meta{flex-direction:row;gap:12px;margin-top:9px;padding:7px 0}
  .forest-journal-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:9px}
  .forest-journal-nav .btn{text-align:center;justify-content:center;padding:4px 2px;font-size:11px}
  .forest-journal-foot{display:none}.forest-journal-page{padding:14px 13px 17px}
  .forest-journal-page h2{font-size:22px}.journal-stat-grid{grid-template-columns:1fr}
}

/* Native top-layer dialogs remain usable above the boot screen on all devices. */
.account-dialog { color: #ecedda; background: #223c30; border: 2px solid #a9bc82; border-radius: 12px; padding: 20px; width: min(92vw, 520px); max-height: 85dvh; overflow: auto; box-sizing: border-box; }
.account-dialog::backdrop { background: #071b16b8; }
.account-dialog h2 { margin-top: 0; font-size: 1.2rem; }
.account-dialog .btn { margin: 5px 4px 5px 0; white-space: normal; }
.account-dialog label { display: block; margin: 12px 0; }
.account-dialog input { display: block; box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; font-size: 16px; border: 1px solid #a9bc82; border-radius: 5px; }
.account-dialog p { line-height: 1.6; overflow-wrap: anywhere; }
#accountLabel { overflow-wrap: anywhere; }

</style>
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">苔芽农场</span>
    </div>
    <div class="hud" id="hud">
      <div class="hud-cell" id="hudDate"><span class="hud-label">日期</span><span class="hud-value">—</span></div>
      <div class="hud-cell" id="hudTime"><span class="hud-label">时间</span><span class="hud-value">—</span></div>
      <div class="hud-cell" id="hudWeather"><span class="hud-label">天气</span><span class="hud-value">—</span></div>
      <div class="hud-cell" id="hudCoins"><span class="hud-label">金币</span><span class="hud-value">—</span></div>
      <div class="hud-cell" id="hudEnergy"><span class="hud-label">体力</span><span class="hud-value">—</span></div>
    </div>
    <div class="topbar-actions">
      <span id="saveState" class="save-state" role="status" aria-live="polite">已保存</span>
      <button type="button" class="btn sm" id="btnAccount">登录</button>
      <button type="button" class="icon-btn" id="btnMenu" aria-label="暂停菜单" title="暂停菜单 (Esc)">☰</button>
    </div>
  </header>

  <aside id="farmAssist" class="farm-assist" hidden aria-label="农场助手">
    <div id="dailyTasks" class="daily-tasks" role="status" aria-live="polite"></div>
    <button id="quickFood" class="btn sm primary" type="button" hidden>吃点东西</button>
    <section id="tutorialCard" class="tutorial-card" hidden aria-label="新手引导">
      <div class="tutorial-copy" aria-live="polite">
        <div id="tutorialTitle" class="tutorial-title"></div>
        <p id="tutorialText"></p>
      </div>
      <div class="tutorial-actions">
        <button id="tutorialPause" class="btn sm" type="button">稍后再学</button>
        <button id="tutorialSkip" class="btn sm ghost" type="button">跳过教程</button>
        <button id="tutorialResume" class="btn sm" type="button" hidden>继续引导</button>
      </div>
    </section>
  </aside>
  <main id="stage">
    <div id="viewport">
      <canvas id="world" width="384" height="256" aria-label="苔芽农场游戏画面，操控 Clawd 像素小螃蟹，使用方向键移动，空格使用工具"></canvas>
      <div id="questStrip" class="quest-strip" aria-label="当前委托">
        <span class="quest-tag">委托</span>
        <span id="questStripText">—</span>
      </div>
      <div id="tileTip" class="tile-tip" hidden aria-live="polite"></div>
      <div id="sceneTag" class="scene-tag" aria-hidden="true">农场</div>
      <div id="fade" class="fade" aria-hidden="true"></div>
    </div>
  </main>

  <div id="dock">
    <div id="hotbar" class="hotbar" role="toolbar" aria-label="工具快捷栏"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <div id="touch" class="touch" aria-hidden="false">
    <div class="dpad">
      <button type="button" class="tbtn tdir" data-dir="0,-1" aria-label="向上移动">▲</button>
      <button type="button" class="tbtn tdir" data-dir="-1,0" aria-label="向左移动">◀</button>
      <button type="button" class="tbtn tdir" data-dir="1,0" aria-label="向右移动">▶</button>
      <button type="button" class="tbtn tdir" data-dir="0,1" aria-label="向下移动">▼</button>
    </div>
    <div class="tact">
      <button type="button" class="tbtn tact-use" id="touchUse" aria-label="使用工具">使用工具</button>
      <button type="button" class="tbtn tact-act" id="touchAct" aria-label="交互">交互</button>
      <button type="button" class="tbtn tact-sm" id="touchBag" aria-label="背包 (B)">背包</button>
      <button type="button" class="tbtn tact-sm" id="touchCraft" aria-label="制作 (C)">制作</button>
      <button type="button" class="tbtn tact-sm" id="touchQuest" aria-label="任务 (J)">任务</button>
    </div>
  </div>

  <div id="reel" class="reel" aria-hidden="true">
    <button type="button" class="tbtn reel-btn" id="reelBtn" aria-label="收线">收线</button>
  </div>

  <div id="windowLayer" class="window-layer" hidden></div>

  <div id="boot" class="boot">
    <div class="boot-card">
      <h1>苔芽农场</h1>
      <p class="boot-sub">春日 · Clawd 的小农场</p>
      <p id="accountLabel" class="boot-note">游客 · 本机存档</p>
      <button type="button" class="btn" id="bootAccount">登录 / 注册</button>
      <div id="bootActions" class="boot-actions"></div>
      <section id="devicePicker" class="device-picker" hidden aria-label="设备选择">
        <h2>设备选择</h2>
        <p>手机和平板以横屏游玩，电脑使用键盘与鼠标。</p>
        <div class="device-options">
          <button type="button" class="btn" data-device="phone">手机<span>安卓 · 横屏触控</span></button>
          <button type="button" class="btn" data-device="tablet">平板<span>安卓 · 横屏触控</span></button>
          <button type="button" class="btn" data-device="computer">电脑<span>键盘与鼠标</span></button>
        </div>
        <button type="button" class="btn ghost" id="deviceBack">返回</button>
      </section>
      <p class="boot-note" id="bootNote">正在读取存档…</p>
    </div>
  </div>


</div>

(function (root) {
  'use strict';
  function checkedConfig(config) {
    if (!config || !config.url || !config.publishableKey) return null;
    var url = new URL(config.url);
    if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || (url.pathname !== '/' && url.pathname !== '')) throw new Error('云服务地址必须为 HTTPS 根地址');

        if (claims.role !== 'anon') throw new Error('key');
      } catch (e) { throw new Error('云配置只允许 publishable / anon 公开密钥'); }
    }

  }

    }) : null;

  };

    if (!this.client) throw new Error('尚未配置云服务，游客存档可正常使用');
    var result = await this.client.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true } });
    if (result.error) throw result.error;
  };
  AuthService.prototype.verify = async function (email, token) {

    var rows = await this.request(id, 'game_saves?user_id=eq.' + id + '&slot_id=eq.' + slot + '&select=*');
    return rows[0] || null;
  };
  CloudSaveRepository.prototype.commit = function (record, deviceId) {
    return this.request(record.userId, 'rpc/commit_game_save', {
      p_slot_id: record.slotId, p_expected_revision: record.revision,
      p_schema_version: record.payload.version, p_payload: record.payload,
      p_device_id: deviceId, p_mutation_id: record.mutationId

  };
  CloudSaveRepository.prototype.backups = function (id, slot) {
    return this.request(id, 'save_backups?user_id=eq.' + id + '&slot_id=eq.' + slot + '&select=*&order=revision.desc&limit=10');
  };

        var wrapper = document.createElement('label'); wrapper.textContent = label;

        control.required = true; wrapper.appendChild(control); form.appendChild(wrapper); return control;

      var email = input('邮箱', 'email', 'email'); email.id = 'accountEmail';
      var code = input('验证码', 'text', 'one-time-code'); code.id = 'accountCode'; code.inputMode = 'numeric'; code.maxLength = 10;
      var send = this.button(form, '发送验证码', function () {
        if (!email.reportValidity()) return;
        run(async function () { await self.auth.sendCode(email.value.trim()); status.textContent = '验证码已发送，请检查收件箱和垃圾邮件。60 秒后可重发。';
          send.dataset.sentAt = String(Date.now()); });
      });
      send.addEventListener('click', function (e) {
        if (Date.now() - Number(send.dataset.sentAt || 0) < 60000) { e.stopImmediatePropagation(); status.textContent = '请稍候再发送验证码。'; }
      }, true);
      this.button(form, '验证并登录', function () {
        if (!email.reportValidity() || !code.reportValidity()) return;
        run(async function () { var session = await self.auth.verify(email.value.trim(), code.value.trim());
          await self.handlers.login(session); dialog.close(); });
      });
      dialog.appendChild(form);
    }
    this.button(dialog, '返回游戏', function () { dialog.close(); });
    if (!dialog.open) dialog.showModal();
  };
  root.MossAccountUI = AccountUI;
}(window));

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);

/* --- 音效（Web Audio 合成，默认关闭） --- */
var Audio2 = (function () {
  var ctx = null, enabled = false, master = null;

    if (ctx) return ctx;

    master = ctx.createGain();
    master.gain.value = 0.16;
    master.connect(ctx.destination);
    return ctx;
  }
  function tone(freq, dur, type, vol, slideTo) {
    if (!enabled) return;
    var c = ensure(); if (!c) return;
    if (c.state === 'suspended' && c.resume) { try { c.resume(); } catch (e) {} }
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, c.currentTime);
    if (slideTo) o.frequency.linearRampToValueAtTime(slideTo, c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, c.currentTime + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(master);
    o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  function noise(dur, vol, hp) {
    if (!enabled) return;
    var c = ensure(); if (!c) return;
    if (c.state === 'suspended' && c.resume) { try { c.resume(); } catch (e) {} }
    var len = Math.max(1, Math.floor(c.sampleRate * dur));
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 600;
    var g = c.createGain(); g.gain.value = vol || 0.35;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }
  var SFX = {
    hoe:      function () { noise(0.12, 0.4, 400); tone(180, 0.1, 'square', 0.16, 120); },
    water:    function () { noise(0.22, 0.22, 1400); tone(520, 0.16, 'sine', 0.1, 780); },
    chop:     function () { noise(0.14, 0.5, 300); tone(140, 0.12, 'square', 0.2, 90); },
    breakrock:function () { noise(0.2, 0.5, 500); tone(220, 0.16, 'square', 0.2, 100); },
    harvest:  function () { tone(660, 0.08, 'triangle', 0.3, 880); },
    trade:    function () { tone(760, 0.07, 'triangle', 0.28); setTimeout(function () { tone(980, 0.09, 'triangle', 0.24); }, 60); },
    fail:     function () { tone(190, 0.1, 'sawtooth', 0.12, 140); },
    quest:    function () { [660, 830, 990].forEach(function (f, i) { setTimeout(function () { tone(f, 0.12, 'triangle', 0.26); }, i * 90); }); },
    fish:     function () { [520, 660, 880, 1040].forEach(function (f, i) { setTimeout(function () { tone(f, 0.14, 'sine', 0.3); }, i * 110); }); },
    splash:   function () { noise(0.3, 0.3, 900); },
    bridge:   function () { [392, 494, 587, 784].forEach(function (f, i) { setTimeout(function () { tone(f, 0.3, 'triangle', 0.24); }, i * 160); }); },
    eat:      function () { noise(0.14, 0.24, 800); tone(360, 0.1, 'sine', 0.16, 520); },
    place:    function () { tone(300, 0.1, 'square', 0.16, 420); }
  };
  return {
    play: function (name) { var f = SFX[name]; if (f) { try { f(); } catch (e) {} } },
    setEnabled: function (v) {

    },
    isEnabled: function () { return enabled; },

  };
})();

function countsAsSlot(id) {
  var it = ITEMS[id];
  return !!it && it.kind !== 'tool';   // 工具不占物品格
}
function countSlots(inv) {
  var n = 0;
  for (var k in inv) {
    if (!Object.prototype.hasOwnProperty.call(inv, k)) continue;
    if (inv[k] > 0 && countsAsSlot(k)) n += Math.ceil(inv[k] / CFG.stack);

  if (!qty) return true;
  if (inv === state.inventory && countSlots(inv) > CFG.bagSlots) return false;

  var cur = inv[id] || 0;
  return countSlotsWith(inv, id, cur + qty) <= CFG.bagSlots;
}

  next[id] = newQty;
  return countSlots(next);
}

/* --- 校验 + 规范化 --- */
function normalizeSave(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.version !== SCHEMA_VERSION) return null;
  var base = newGameState();
  var s = base;
  function num(v, d, min, max) {
    if (typeof v !== 'number' || !isFinite(v)) return d;
    if (min != null && v < min) return min;
    if (max != null && v > max) return max;
    return v;
  }
  s.totalDay = Math.max(1, Math.floor(num(raw.totalDay, 1, 1, 100000)));
  s.timeMinutes = num(raw.timeMinutes, CFG.dayStart, CFG.dayStart, CFG.dayEnd);
  s.coins = Math.max(0, Math.floor(num(raw.coins, 0, 0, 1e9)));
  s.energy = clamp(Math.floor(num(raw.energy, CFG.maxEnergy, 0, CFG.maxEnergy)), 0, CFG.maxEnergy);
  s.sceneId = SCENE_ORDER.indexOf(raw.sceneId)>=0 ? raw.sceneId : 'farm';
  if (raw.player && typeof raw.player === 'object') {
    s.player = {
      x: Math.floor(num(raw.player.x, 9, 0, MAPS[s.sceneId].w-1)),
      y: Math.floor(num(raw.player.y, 10, 0, MAPS[s.sceneId].h-1)),
      face: ['up', 'down', 'left', 'right'].indexOf(raw.player.face) >= 0 ? raw.player.face : 'down'
    };
  }
  var toolIds = TOOLS.map(function (t) { return t.tool; });
  s.selectedTool = toolIds.indexOf(raw.selectedTool) >= 0 ? raw.selectedTool : 'hoe';
  s.selectedSeed = CROP_ORDER.indexOf(raw.selectedSeed) >= 0 ? raw.selectedSeed : 'radish';
  s.selectedDevice = (raw.selectedDevice && ITEMS[raw.selectedDevice] && ITEMS[raw.selectedDevice].device) ? raw.selectedDevice : 'dev_chest';
  if (raw.weather && (raw.weather.today === 'sun' || raw.weather.today === 'rain')) {
    s.weather = {
      today: raw.weather.today,
      tomorrow: (raw.weather.tomorrow === 'rain') ? 'rain' : 'sun'
    };
  }
  s.randomState = (typeof raw.randomState === 'number' && isFinite(raw.randomState)) ? (raw.randomState | 0) : 123456789;

  s.inventory = sanitizeInv(raw.inventory);
  if (!s.inventory.tool_shovel) s.inventory.tool_shovel = 1;   // 旧存档也补发一把小铲子（只发给背包，箱子不受影响）
  s.overloaded = countSlots(s.inventory) > CFG.bagSlots;
  s.plots = sanitizePlots(raw.plots);
  s.resourceNodes = sanitizeNodes(raw.resourceNodes);
  s.structures = sanitizeStructures(raw.structures);
  s.shipping = sanitizeInv(raw.shipping);
  s.houseChest = sanitizeInv(raw.houseChest);   // 旧存档没有该字段时补空对象，不影响其它进度
  s.tutorial = normalizeTutorial(raw.tutorial);
  s.npcFriendship = {
    yaya: clamp(Math.floor(num(raw.npcFriendship && raw.npcFriendship.yaya, 0, 0, 100)), 0, 100),
    aqi:  clamp(Math.floor(num(raw.npcFriendship && raw.npcFriendship.aqi, 0, 0, 100)), 0, 100),
    ds:   clamp(Math.floor(num(raw.npcFriendship && raw.npcFriendship.ds, 0, 0, 100)), 0, 100)
  };
  Object.keys(NPCS).forEach(function(id){s.npcFriendship[id]=clamp(Math.floor(num(raw.npcFriendship&&raw.npcFriendship[id],0,0,100)),0,100);});
  s.npcDailyInteractions = (raw.npcDailyInteractions && typeof raw.npcDailyInteractions === 'object') ? raw.npcDailyInteractions : {};
  // DS 小姐：没有该字段的旧存档视为尚未相遇，她会在玩家解锁钓竿后的第一次钓鱼时出现。
  s.dsMet = !!raw.dsMet;
  s.exploration = normalizeExploration(raw.exploration);
  if ((s.sceneId==='city'||s.sceneId.indexOf('city_')===0)&&!s.exploration.city){s.sceneId='town';s.player={x:14,y:22,face:'up'};}
  if ((s.sceneId === 'forest' && !s.exploration.forest) || (s.sceneId.indexOf('mine') === 0 && (!s.exploration.mine || +s.sceneId.slice(4)>s.exploration.depth))) { s.sceneId='town';s.player={x:14,y:2,face:'down'}; }
  s.rodLevel = clamp(Math.floor(num(raw.rodLevel, 1, 1, 3)), 1, 3);
  var qp = {};
  QUESTS.forEach(function (q) {
    var v = raw.questProgress && raw.questProgress[q.id];
    qp[q.id] = (v === 'done' || v === 'unlocked') ? v : 'locked';
  });
  if (raw.questProgress && raw.questProgress[1] === 'unlocked' && raw.questProgress[1] !== 'done') qp[1] = 'unlocked';
  s.questProgress = qp;
  // 链条修正
  for (var i = 0; i < QUESTS.length; i++) {
    var q = QUESTS[i];
    if (qp[q.id] === 'unlocked' && i > 0 && qp[QUESTS[i - 1].id] !== 'done') qp[q.id] = 'locked';
    if (qp[q.id] === 'done' && i < QUESTS.length - 1 && qp[QUESTS[i + 1].id] === 'locked') qp[QUESTS[i + 1].id] = 'unlocked';
  }
  s.unlockedRecipes = ['chest'];
  if (Array.isArray(raw.unlockedRecipes)) {
    raw.unlockedRecipes.forEach(function (r) { if (s.unlockedRecipes.indexOf(r) < 0) s.unlockedRecipes.push(r); });
  }
  if (qp[2] === 'done' && s.unlockedRecipes.indexOf('sprinkler') < 0) s.unlockedRecipes.push('sprinkler');
  s.bridgeRepaired = !!raw.bridgeRepaired;
  s.settleHistory = normalizeSettleHistory(raw.settleHistory);
  s.nextStructureId = Math.max(1, Math.floor(num(raw.nextStructureId, 1, 1, 1e6)));
  s.settings = {
    sound: !!(raw.settings && raw.settings.sound),
    showHelpOnce: raw.settings && raw.settings.showHelpOnce === false ? false : true
  };
  s.migratedFrom = typeof raw.migratedFrom === 'string' ? raw.migratedFrom : null;
  return s;
}

/* 日结算记录：保留最近 7 天，日历里可以回看。 */
function normalizeSettleHistory(v) {
  var out = [];
  if (!Array.isArray(v)) return out;
  for (var i = 0; i < v.length && out.length < 7; i++) {
    var e = v[i];
    if (!e || typeof e !== 'object') continue;
    var rec = {
      day: clamp(Math.floor(isInt(e.day) ? e.day : 0), 0, 100000),
      income: clamp(Math.floor(isFinite(e.income) ? e.income : 0), 0, 1e9),
      dailyAllowance: clamp(Math.floor(isFinite(e.dailyAllowance) ? e.dailyAllowance : 0), 0, 1e9),
      matured: clamp(Math.floor(isFinite(e.matured) ? e.matured : 0), 0, 9999),
      jam: clamp(Math.floor(isFinite(e.jam) ? e.jam : 0), 0, 9999),
      weather: e.weather === 'rain' ? 'rain' : 'sun',
      auto: !!e.auto,
      sold: [],
      matureDetail: []
    };
    if (Array.isArray(e.sold)) {
      for (var j = 0; j < e.sold.length && rec.sold.length < 40; j++) {
        var s = e.sold[j];
        if (!s || typeof s !== 'object') continue;
        rec.sold.push({
          id: typeof s.id === 'string' ? s.id : '',
          name: typeof s.name === 'string' ? s.name : '',
          qty: clamp(Math.floor(isFinite(s.qty) ? s.qty : 0), 0, 999999),
          value: clamp(Math.floor(isFinite(s.value) ? s.value : 0), 0, 1e9)
        });
      }
    }
    if (Array.isArray(e.matureDetail)) {
      for (var m = 0; m < e.matureDetail.length && rec.matureDetail.length < 40; m++) {
        if (typeof e.matureDetail[m] === 'string') rec.matureDetail.push(e.matureDetail[m]);
      }
    }
    out.push(rec);
  }
  return out;
}

function sanitizeInv(v) {
  var out = {};
  if (!v || typeof v !== 'object') return out;
  for (var k in v) {
    if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
    if (!ITEMS[k]) continue;
    var n = Math.floor(v[k]);
    if (isFinite(n) && n > 0) out[k] = Math.min(n, 999999);
  }
  return out;
}
function sanitizePlots(v) {
  var out = {};
  if (!v || typeof v !== 'object') return out;
  for (var k in v) {
    if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
    var p = v[k];
    if (!p || typeof p !== 'object') continue;
    var parts = k.split(',');
    if (parts.length !== 2) continue;
    var x = parseInt(parts[0], 10), y = parseInt(parts[1], 10);
    if (!isInt(x) || !isInt(y)) continue;
    if (x < 6 || x > 21 || y < 4 || y > 9) continue;
    var rec = { tilled: true, water: !!p.water, crop: null, age: 0, mature: false, harvested: false, regrow: 0 };
    if (CROPS[p.crop]) {
      rec.crop = p.crop;
      rec.age = clamp(Math.floor(isInt(p.age) ? p.age : 0), 0, CROPS[p.crop].growDays);
      rec.harvested = !!p.harvested;
      rec.regrow = clamp(Math.floor(isInt(p.regrow) ? p.regrow : 0), 0, 9);
      rec.mature = !!p.mature;
    }
    out[key2(x, y)] = rec;
  }
  return out;
}
function sanitizeNodes(v) {
  var out = {};
  if (!v || typeof v !== 'object') return out;
  for (var k in v) {
    if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
    var n = v[k];
    if (!n || typeof n !== 'object') continue;
    if (n.type === 'tree')  out[k] = { type: 'tree',  hp: clamp(Math.floor(isInt(n.hp) ? n.hp : 0), 0, 3), active: (n.hp > 0) };
    if (n.type === 'stone') out[k] = { type: 'stone', hp: clamp(Math.floor(isInt(n.hp) ? n.hp : 0), 0, 2), active: (n.hp > 0) };
    if (n.type === 'berry') out[k] = { type: 'berry', active: n.active !== false };
  }
  return out;
}
function sanitizeStructures(v) {
  var out = [];
  if (!Array.isArray(v)) return out;
  for (var i = 0; i < v.length; i++) {
    var s = v[i];
    if (!s || typeof s !== 'object') continue;
    var d = s.device;
    if (['chest', 'sprinkler', 'jam_jar'].indexOf(d) < 0) continue;
    var x = s.x, y = s.y;
    if (!isInt(x) || !isInt(y)) continue;
    var rec = { id: s.id || ('s' + i), device: d, x: x, y: y };
    if (d === 'chest') rec.contents = sanitizeInv(s.contents);
    if (d === 'jam_jar') {
      rec.input = isInt(s.input) ? s.input : 0;
      rec.startDay = isInt(s.startDay) ? s.startDay : 0;
      rec.ready = !!s.ready;
    }
    out.push(rec);
  }
  return out;
}

/* --- 天气 --- */
function rollWeatherFor(day, s) {
  if (day === 1 || day === 2) return 'sun';
  if (day === 3) return 'rain';
  return (rand(s) < 0.3) ? 'rain' : 'sun';
}
function refreshForecast() {
  state.weather = { today: state.weather.today, tomorrow: rollWeatherFor(state.totalDay + 1, state) };
}
function isRaining() { return state.weather.today === 'rain'; }

/* --- 新游戏初始化 --- */
function initNewGameWorld(s) {
  s = s || state;
  s.weather = { today: 'sun', tomorrow: rollWeatherFor(2, s) };
  s.plots = {};
  s.resourceNodes = {};
  MAPS.farm.trees.forEach(function (t) { s.resourceNodes[key2(t[0], t[1])] = { type: 'tree', hp: 3, active: true }; });
  MAPS.farm.rocks.forEach(function (t) { s.resourceNodes[key2(t[0], t[1])] = { type: 'stone', hp: 2, active: true }; });
  MAPS.farm.berries.forEach(function (t) { s.resourceNodes[key2(t[0], t[1])] = { type: 'berry', active: true }; });
  s.structures = [];
  s.shipping = {};
  s.sceneId = 'farm';
  s.player = { x: 9, y: 10, face: 'down' };
  s.totalDay = 1;
  s.timeMinutes = CFG.dayStart;
  s.energy = CFG.maxEnergy;
  s.questProgress = { 1: 'unlocked', 2: 'locked', 3: 'locked', 4: 'locked' };
}

/* --- v1 迁移 --- */
function migrateV1(old) {
  var s = newGameState();
  s.migratedFrom = 'moss-farm-v1';
  s.tutorial = newTutorial('skipped');
  s.totalDay = Math.max(1, Math.floor(isInt(old.day) ? old.day : 1));
  s.coins = Math.max(0, Math.floor(isInt(old.money) ? old.money : 50));
  var radishSeeds = Math.max(0, Math.floor(isInt(old.seeds) ? old.seeds : 0));
  var radishCrops = Math.max(0, Math.floor(isInt(old.crops) ? old.crops : 0));
  s.inventory = {};
  if (radishSeeds > 0) s.inventory.seed_radish = radishSeeds;
  s.inventory.seed_potato = 2;
  if (radishCrops > 0) s.inventory.radish = radishCrops;
  s.inventory.tool_hoe = 1; s.inventory.tool_can = 1;
  s.inventory.tool_axe = 1; s.inventory.tool_pick = 1; s.inventory.basket = 1;
  s.inventory.tool_shovel = 1;

  s.plots = {};
  var plots = old.plots || {};
  for (var k in plots) {
    if (!Object.prototype.hasOwnProperty.call(plots, k)) continue;
    var p = plots[k];
    if (!p || typeof p !== 'object') continue;
    var parts = k.split(',');
    if (parts.length !== 2) continue;
    var x = parseInt(parts[0], 10), y = parseInt(parts[1], 10);
    if (!isInt(x) || !isInt(y)) continue;
    if (x < 6 || x > 21 || y < 4 || y > 9) continue;      // 旧地块 x6..14/y4..9 都落在新区内
    var rec = { tilled: true, water: !!p.water, crop: null, age: 0, mature: false, harvested: false, regrow: 0 };
    if (p.seed) {
      rec.crop = 'radish';
      rec.age = clamp(Math.floor(isInt(p.age) ? p.age : 0), 0, CROPS.radish.growDays);
      rec.mature = rec.age >= CROPS.radish.growDays;
    }
    s.plots[key2(x, y)] = rec;
  }

  var px = isInt(old.x) ? old.x : 9, py = isInt(old.y) ? old.y : 10;
  var face = 'down';
  if (Array.isArray(old.face)) {
    if (old.face[0] === 0 && old.face[1] === -1) face = 'up';
    else if (old.face[0] === 0 && old.face[1] === 1) face = 'down';
    else if (old.face[0] === -1 && old.face[0] === 0) face = 'left';
    else if (old.face[0] === 1 && old.face[1] === 0) face = 'right';
  }
  if (isSolidStatic('farm', px, py)) { px = 9; py = 10; }
  s.player = { x: px, y: py, face: face };
  s.sceneId = 'farm';
  s.energy = CFG.maxEnergy;
  s.timeMinutes = CFG.dayStart;
  s.weather = { today: 'sun', tomorrow: rollWeatherFor(s.totalDay + 1, s) };

  s.resourceNodes = {};
  MAPS.farm.trees.forEach(function (t) { s.resourceNodes[key2(t[0], t[1])] = { type: 'tree', hp: 3, active: true }; });
  MAPS.farm.rocks.forEach(function (t) { s.resourceNodes[key2(t[0], t[1])] = { type: 'stone', hp: 2, active: true }; });
  MAPS.farm.berries.forEach(function (t) { s.resourceNodes[key2(t[0], t[1])] = { type: 'berry', active: true }; });

  s.questProgress = { 1: 'unlocked', 2: 'locked', 3: 'locked', 4: 'locked' };
  s.overloaded = countSlots(s.inventory) > CFG.bagSlots;
  return s;
}

var LoadResult = { state: null, notice: '', corrupt: null };

function loadGame() {
  LoadResult = { state: null, notice: '', corrupt: null };
  var raw2 = null;
  try {
    SaveRepository.migrateLegacy(normalizeSave, migrateV1);
    var record = SaveRepository.read();
    if (record) raw2 = JSON.stringify(record.payload);
  } catch (error) { LoadResult.notice = error.message; LoadResult.corrupt = SaveRepository.storage.getItem(SAVE_KEY); }
  if (!raw2 && !SaveRepository.userId) raw2 = readRaw('moss-farm-v2');
  if (raw2) {
    try {
      var parsed = JSON.parse(raw2);
      if (parsed.version > SCHEMA_VERSION) { LoadResult.future = true; LoadResult.notice = "此存档来自更新版本，请升级游戏；原始进度已保留。"; return LoadResult; }
      var norm = normalizeSave(parsed);
      if (norm) { norm.overloaded = norm.overloaded || countSlots(norm.inventory) > CFG.bagSlots; LoadResult.state = norm; return LoadResult; }
      throw new Error('schema');
    } catch (e) {
      // 损坏：保留原始数据，不静默覆盖
      writeRaw(CORRUPT_KEY, raw2);
      LoadResult.corrupt = raw2;
    }
  }
  var raw1 = SaveRepository.userId ? null : readRaw(SAVE_KEY_V1);
  if (raw1) {
    try {
      var old = JSON.parse(raw1);
      if (old && (isInt(old.day) || old.plots)) {
        var mig = migrateV1(old);
        LoadResult.state = mig;
        LoadResult.notice = '已从第一版存档迁移：' + mig.totalDay + ' 天 · ' + mig.coins + ' 金';
        return LoadResult;
      }
    } catch (e) { /* 忽略损坏的旧档 */ }
  }
  LoadResult.state = null;   // 需要新建
  return LoadResult;
}

/* --- 装饰（确定性生成，刷新不变） --- */
var decorCache = {};
function getDecor(sceneId) {
  if (decorCache[sceneId]) return decorCache[sceneId];
  var map = MAPS[sceneId];
  var out = [];
  var seed = 0;
  for (var i = 0; i < sceneId.length; i++) seed = (seed * 31 + sceneId.charCodeAt(i)) | 0;
  var rnd = mulberry32(seed);
  for (var y = 0; y < map.h; y++) {
    for (var x = 0; x < map.w; x++) {
      if (map.t[x][y] !== T_GRASS) continue;
      var r = rnd();
      if (r > 0.86) out.push({ t: 'tuft', x: x, y: y, v: Math.floor(rnd() * 3) });
      else if (r > 0.80) out.push({ t: 'flower', x: x, y: y, v: Math.floor(rnd() * 3) });
    }
  }
  if (map.decor) map.decor.forEach(function (d) { out.push(d); });
  decorCache[sceneId] = out;
  return out;
}

function terrainAt(sceneId, x, y) {
  var map = MAPS[sceneId];
  if (x < 0 || y < 0 || x >= map.w || y >= map.h) return T_BUILDING;
  return map.t[x][y];
}
function isSolidStatic(sceneId, x, y) {
  var map = MAPS[sceneId];
  if (x < 0 || y < 0 || x >= map.w || y >= map.h) return true;
  return map.solid[x][y] === 1;
}

/* 完整碰撞（静态 + 资源节点 + 设备 + 室内家具 + 桥状态） */
function isSolid(sceneId, x, y) {
  if (isSolidStatic(sceneId, x, y)) {
    if (sceneId === 'town' && state.bridgeRepaired && x >= 26 && x <= 29 && y >= 10 && y <= 11) return false;
    return true;
  }
  var en=exploreNode(sceneId,x,y);if(en&&en.saved.hp>0&&en.def.type!=='forage')return true;
  if (sceneId === 'house' && houseFurnitureAt(x, y)) return true;
  if (sceneId === 'farm') {
    var n = state.resourceNodes[key2(x, y)];
    if (n && n.active && (n.type === 'tree' || n.type === 'stone')) return true;
  }
  if (sceneId === 'farm') {
    for (var i = 0; i < state.structures.length; i++) {
      var s = state.structures[i];
      if (s.x === x && s.y === y) return true;
    }
  }
  return false;
}

function isWater(sceneId, x, y) {
  var t = terrainAt(sceneId, x, y);
  return t === T_WATER || t === T_POND;
}

/* --- 四方向 BFS 寻路 --- */
function findPath(sceneId, sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  if (isSolid(sceneId, tx, ty)) return null;
  var map = MAPS[sceneId];
  var prev = {}, q = [[sx, sy]], head = 0, seen = {};
  seen[sx + ',' + sy] = 1;
  while (head < q.length) {
    var cur = q[head++];
    var cx = cur[0], cy = cur[1];
    var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
    for (var i = 0; i < 4; i++) {
      var nx = cx + dirs[i][0], ny = cy + dirs[i][1];
      if (nx < 0 || ny < 0 || nx >= map.w || ny >= map.h) continue;
      var k = nx + ',' + ny;
      if (seen[k]) continue;
      if (isSolid(sceneId, nx, ny)) continue;
      seen[k] = 1; prev[k] = [cx, cy];
      if (nx === tx && ny === ty) {
        var path = [], ck = k;
        while (ck) { var p = ck.split(','); path.unshift([parseInt(p[0], 10), parseInt(p[1], 10)]); ck = prev[ck] ? prev[ck][0] + ',' + prev[ck][1] : null; }
        path.shift();
        return path;
      }
      q.push([nx, ny]);
    }
  }
  return null;
}

/* --- 出口 --- */
var sceneSwitch = { busy: false };
function checkExit() {
  var map = MAPS[state.sceneId];
  var px = state.player.x, py = state.player.y;
  var e;
  for (e = 0; e < (map.exits || []).length; e++) {
    var ex = map.exits[e];
    if (ex.x === px && ex.y === py) { if(ex.to==='city'&&!exploreState().city){toast('先在小镇南口驿路牌按 E 办理城市通行证。');return false;} if(ex.to === 'forest' && !exploreState().forest){toast('森林入口尚未清理。到小镇北口路牌按 E 修复。');return false;} doSwitchScene(ex.to, ex.tx, ex.ty); return true; }
  }
  if (map.eastExits) {
    for (e = 0; e < map.eastExits.length; e++) {
      var ex2 = map.eastExits[e];
      if (ex2.x === px && ex2.y === py) {
        if (!state.bridgeRepaired) { toast('小桥还没修好，东边过不去。'); return true; }
        doSwitchScene(ex2.to, ex2.tx, ex2.ty); return true;
      }
    }
  }
  return false;
}

function doSwitchScene(to, tx, ty) {
  if (sceneSwitch.busy) return;
  sceneSwitch.busy = true;
  var fade = $('#fade');
  fade.classList.add('on');
  setTimeout(function () {
    state.sceneId = to;
    if (to === 'house') tutorialEvent('entered');
    state.player.x = clamp(tx, 0, MAPS[to].w - 1);
    state.player.y = clamp(ty, 0, MAPS[to].h - 1);
    syncPlayerPixel();
    updateNpcPositions(true);
    onSceneChanged();
    saveNow();
    setTimeout(function () { fade.classList.remove('on'); sceneSwitch.busy = false; }, 30);
  }, 200);
}

function onSceneChanged() {
  if (isSolid(state.sceneId, state.player.x, state.player.y)) {
    // 落点被占用时向周围找空位
    var found = false;
    for (var r = 1; r <= 3 && !found; r++) {
      for (var dy = -r; dy <= r && !found; dy++) for (var dx = -r; dx <= r && !found; dx++) {
        if (!isSolid(state.sceneId, state.player.x + dx, state.player.y + dy)) {
          state.player.x += dx; state.player.y += dy; found = true;
        }
      }
    }
    if (!found) { state.player.x = 9; state.player.y = 10; }
  }
  syncPlayerPixel();
  Game.hoverTile = null;      // 换场景后旧的悬停格已经没有意义
  Game.selectTile = null;
  refreshHud();
  refreshHotbar();
}

function syncPlayerPixel() {
  var map = MAPS[state.sceneId];
  var tx = clamp(state.player.x, 0, map.w - 1);
  var ty = clamp(state.player.y, 0, map.h - 1);
  state.player.x = tx; state.player.y = ty;
  Game.ppos.x = tx * TILE + 8;
  Game.ppos.y = ty * TILE + 12;
}

function explorationTier(){
  var p=exploreState().explorePoints||0;
  return p>=70?3:p>=35?2:p>=20?1:0;
}
function dailyJobsForDay(day){
  var e=exploreState();
  var ids=Object.keys(LIVING_JOBS).filter(function(id){
    var sc=NPCS[id]&&NPCS[id].scene;
    return sc==='town'||(sc==='forest'&&e.forest)||(sc&&sc.indexOf('city_')===0&&e.city)||(sc&&sc.indexOf('mine')===0&&e.mine);
  });
  if(ids.length<3)ids=Object.keys(LIVING_JOBS);
  var seed=((day*1103515245+12345)>>>0);
  function next(){seed=(seed*1664525+1013904223)>>>0;return seed;}
  while(ids.length>3)ids.splice(next()%ids.length,1);
  return ids;
}
function activeDailyJobIds(){

function specialQuestDone(q,kind){var e=exploreState();return !!e[kind==='bond'?'bondDone':'storyDone'][q.id];}
function specialQuestUnlocked(q,kind){
  if(kind==='bond')return (state.npcFriendship[q.npc]||0)>=q.minFriendship;
  if(q.city&&!exploreState().city)return false;
  if(q.minDepth&&exploreState().depth<q.minDepth)return false;
  return explorationTier()>=q.minTier;
}
function specialQuestReady(q){return Object.keys(q.need).every(function(k){return invCount(k)>=q.need[k];});}
function specialQuestNeedText(q){return Object.keys(q.need).map(function(k){return itemName(k)+' '+invCount(k)+' / '+q.need[k];});}
function submitSpecialQuest(q,kind){
  if(specialQuestDone(q,kind)){toast('这份委托已经完成。');return false;}
  if(!specialQuestUnlocked(q,kind)){toast('还没有达到解锁条件。');return false;}
  if(!specialQuestReady(q)){toast('材料还不够。');return false;}
  var reward=q.reward||{}, items=reward.items||{};
  if(!Object.keys(items).every(function(k){return bagAccepts(k,items[k]);})){toast('背包放不下奖励。');return false;}
  Object.keys(q.need).forEach(function(k){invRemove(k,q.need[k]);});
  Object.keys(items).forEach(function(k){invAdd(k,items[k]);});
  state.coins+=(reward.coins||0);
  exploreState()[kind==='bond'?'bondDone':'storyDone'][q.id]=true;
  exploreState().explorePoints+=reward.explorePoints||0;
  if(kind==='bond')state.npcFriendship[q.npc]=clamp((state.npcFriendship[q.npc]||0)+5,0,100);
  markDirty();refreshHud();saveNow();toast('委托完成：'+q.title+'。');return true;
}

function findInteractable(px, py, fx, fy) {
  var list = INTERACTABLES[state.sceneId] || [];
  var i, it;
  // 优先正前方
  for (i = 0; i < list.length; i++) {
    it = list[i];
    if (it.x === fx && it.y === fy) return it;
  }
  // 其次相邻
  for (i = 0; i < list.length; i++) {
    it = list[i];
    for (var j = 0; j < it.stand.length; j++) {
      if (it.stand[j][0] === px && it.stand[j][1] === py) return it;
    }
  }
  return null;
}
function findNpcAdjacent(px, py, fx, fy) {
  var best = null, bestD = 99;
  for (var id in NPCS) {
    if (!Object.prototype.hasOwnProperty.call(NPCS, id)) continue;
    if (NPCS[id].scene !== state.sceneId) continue;
    // DS 小姐在相遇之前不在场：既不显示也不能对话。
    if (id === 'ds' && !state.dsMet) continue;
    var n = npcRuntime[id];
    if (!n) continue;
    if (n.x === fx && n.y === fy) return id;
    var d = Math.abs(n.x - px) + Math.abs(n.y - py);
    if (d <= 1 && d < bestD) { bestD = d; best = id; }
  }
  return best;
}
